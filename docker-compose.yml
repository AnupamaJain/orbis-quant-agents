services:
  orbisquantagents:
    build: .
    env_file:
      - .env
    volumes:
      - ./results:/home/appuser/app/results
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  orbisquantagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - ./results:/home/appuser/app/results
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - MCP_PORT=8001
      - MCP_API_KEY=${MCP_API_KEY:-}
      - MCP_RATE_LIMIT=30
    tty: true
    stdin_open: true

volumes:
  ollama_data:

